[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers --html=output/report.html --self-contained-html
markers =
    unit: pure logic tests, no network or browser
    api: tests that call the Rick and Morty API
    ui: Selenium tests that need Chrome
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
log_file = output/test_run.log
log_file_level = DEBUG